 navIds.forEach((id,i)=>{const el=document.getElementById(id);const href=navPaths[i],hashAt=href.indexOf("#"),base=hashAt>=0?href.slice(0,hashAt):href,hash=hashAt>=0?href.slice(hashAt):"";el.href=base+(base.includes("?")?"&":"?")+"lang="+encodeURIComponent(currentLang)+hash;el.textContent=navLabels[currentLang][i];});
 document.getElementById("memo").placeholder=t.placeholder||TEXT.ko.placeholder;
 const prep=document.getElementById("prep"),castle=document.getElementById("castle");
 [prep,castle].forEach(sel=>{if(!sel)return;sel.querySelector('option[value="패"]').textContent=t.loss;sel.querySelector('option[value="승"]').textContent=t.win;});
 const img=document.querySelector(".hero img");if(img)img.alt=currentLang==="en"?"KOR1816 Castle War image":currentLang==="ja"?"KOR1816 城戦画像":currentLang==="zh"?"KOR1816 城堡战图片":currentLang==="de"?"KOR1816 Burgenkriegsbild":currentLang==="it"?"Immagine della Guerra del Castello KOR1816":currentLang==="es"?"Imagen de la Guerra del Castillo KOR1816":currentLang==="tr"?"KOR1816 Kale Savaşı görseli":"KOR1816 캐슬전 이미지";
}
function esc(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function dateLabel(d){return String(d||"").replace(/^(\d{4})-(\d{2})-(\d{2})$/,"$1.$2.$3").replace(/^(\d{4})-(\d{2})$/,"$1.$2");}
function render(){
 const root=document.getElementById("records"),t=TEXT[currentLang];
 root.innerHTML=[...records].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r=>{
  const prep=r.prep==="승"?"승":"패",castle=r.castle==="승"?"승":"패";
  const overall=castle,ours=overall,opponentResult=overall==="승"?"패":"승";
  return '<article class="record"><div class="record-head"><strong>'+esc(dateLabel(r.date))+'</strong><span class="opponent-label">'+esc(t.opponentTitle)+' '+esc(r.opponent)+'</span></div><div class="match-title">'+esc(t.matchTitle||t.title)+'</div><div class="matchup"><div class="side"><div class="result '+(ours==="승"?"win":"loss")+'">'+(ours==="승"?t.win:t.loss)+'</div><div class="kingdom">1816</div></div><div class="vs">VS</div><div class="side"><div class="result '+(opponentResult==="승"?"win":"loss")+'">'+(opponentResult==="승"?t.win:t.loss)+'</div><div class="kingdom">'+esc(r.opponent)+'</div></div></div><div class="phases"><div class="phase"><span>'+t.prep+'</span><strong class="'+(prep==="승"?"win":"loss")+'">'+(prep==="승"?t.win:t.loss)+'</strong></div><div class="phase"><span>'+t.castle+'</span><strong class="'+(castle==="승"?"win":"loss")+'">'+(castle==="승"?t.win:t.loss)+'</strong></div></div>'+(r.memo?'<div class="memo">📝 '+esc(r.memo)+'</div>':'')+'</article>';
 }).join("");
}
async function loadRecords(){
 try{await signInAnonymously(auth).catch(()=>{});const snap=await getDoc(recordsDoc);if(snap.exists()&&Array.isArray(snap.data().records))records=snap.data().records;}
 catch(e){console.warn(e);document.getElementById("msg").textContent=TEXT[currentLang].readError;}
 render();
}
async function ensureAdmin(){
 let user=auth.currentUser;
 if(!user||!user.email){try{user=(await signInWithPopup(auth,new GoogleAuthProvider())).user;}catch(e){alert("Google 관리자 로그인이 취소되었거나 실패했습니다.");return false;}}
 if(!user.email||!ADMIN_EMAILS.includes(user.email.toLowerCase())){alert("등록된 관리자 Google 계정으로 로그인해 주세요.");try{await signOut(auth);await signInAnonymously(auth);}catch{}return false;}
 return true;
}
async function openEditor(){if(!await ensureAdmin())return;document.getElementById("editor").classList.add("open");if(!document.getElementById("date").value)document.getElementById("date").value=new Date().toISOString().slice(0,10);}
function closeEditor(){document.getElementById("editor").classList.remove("open");}
async function saveRecord(){
 const date=document.getElementById("date").value,opponent=Number(document.getElementById("opponent").value),prep=document.getElementById("prep").value,castle=document.getElementById("castle").value,memo=document.getElementById("memo").value.trim(),t=TEXT[currentLang];
 if(!date||!Number.isInteger(opponent)||opponent<1||opponent>9999){document.getElementById("editorMsg").textContent=t.need;return;}
 if(!await ensureAdmin())return;
 try{
  const next=[{date,opponent,prep,castle,memo},...records.filter(r=>!(r.date===date&&Number(r.opponent)===opponent))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  await setDoc(recordsDoc,{records:next,updatedAt:new Date().toISOString()});
  records=next;render();document.getElementById("editorMsg").textContent=t.saved;document.getElementById("opponent").value="";document.getElementById("memo").value="";
 }catch(e){console.error(e);document.getElementById("editorMsg").textContent="Save failed: "+(e.message||"unknown error");}
}
window.openEditor=openEditor;window.closeEditor=closeEditor;window.saveRecord=saveRecord;window.loadRecords=loadRecords;
applyLanguage();loadRecords();
